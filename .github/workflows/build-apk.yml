name: Compilar RentableZone APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verificar ZIP
        run: |
          echo "Contenido del repositorio:"
          ls -lah
          test -f RentableZone_A11_v0.4.3_ACTUALIZACION_OFERTA.zip

      - name: Descomprimir proyecto
        run: |
          rm -rf proyecto
          mkdir -p proyecto
          unzip -o RentableZone_A11_v0.4.3_ACTUALIZACION_OFERTA.zip -d proyecto

      - name: Verificar proyecto Android
        run: |
          test -d proyecto/RentableZone
          test -f proyecto/RentableZone/settings.gradle.kts
          test -f proyecto/RentableZone/build.gradle.kts
          test -f proyecto/RentableZone/app/build.gradle.kts
          echo "Proyecto encontrado correctamente:"
          find proyecto/RentableZone -maxdepth 2 -type f | sort

      - name: Compilar APK Debug
        working-directory: proyecto/RentableZone
        run: |
          gradle clean assembleDebug --stacktrace

      - name: Verificar APK
        run: |
          test -f proyecto/RentableZone/app/build/outputs/apk/debug/app-debug.apk
          ls -lh proyecto/RentableZone/app/build/outputs/apk/debug/app-debug.apk

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: RentableZone-v0.4.3-APK
          path: proyecto/RentableZone/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
